<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geon Framework Visualizer</title>
    <!-- Tailwind CSS (CDN for zero-build setup) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">

    <!-- KaTeX for formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" crossorigin="anonymous"></script>

    <!-- Three.js Library & Addons via Import Maps -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>
</head>
<body class="bg-[#050510] text-slate-200 font-sans overflow-hidden">

    <div class="w-full h-screen flex flex-col md:flex-row">
        <!-- 3D Canvas Area -->
        <div id="canvas-container" class="flex-grow h-[60vh] md:h-full relative"></div>

        <!-- Sidebar Area -->
        <div id="sidebar" class="w-full md:w-[400px] h-[40vh] md:h-full bg-slate-900 border-t md:border-t-0 md:border-l border-slate-700 p-6 overflow-y-auto flex flex-col gap-6 shadow-2xl relative z-10">
            <!-- Header -->
            <div>
                <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500 tracking-tight">Geon Framework</h1>
                <p class="text-sm text-slate-400 mt-1 font-mono">By Daniel Gezin</p>
            </div>

            <!-- Guided Tour Controls -->
            <div class="p-4 bg-slate-800/50 rounded-xl border border-slate-700 backdrop-blur-sm flex justify-between items-center gap-2">
                <button id="btn-prev" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm font-medium transition-colors text-white disabled:opacity-50 disabled:cursor-not-allowed">
                    &larr; Previous
                </button>
                <div class="text-xs font-mono text-slate-400" id="tour-progress">
                    Step 1 / 8
                </div>
                <button id="btn-next" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded text-sm font-medium transition-colors text-white shadow-lg shadow-blue-900/50 disabled:opacity-50 disabled:cursor-not-allowed">
                    Next &rarr;
                </button>
            </div>

            <!-- Quick Jump Dropdown -->
            <div>
                <select id="tour-select" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg block p-2.5 focus:ring-blue-500 focus:border-blue-500">
                </select>
            </div>

            <!-- Dynamic Documentation -->
            <div id="documentation" class="flex-grow flex flex-col gap-4">
                <!-- Injected via JS -->
            </div>

            <!-- Legend -->
            <div class="mt-auto pt-4 border-t border-slate-800">
                <h4 class="text-xs font-semibold text-slate-500 mb-2">Color Mapping Legend</h4>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div> +E (Electric)</div>
                    <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.6)]"></div> -E (Electric)</div>
                    <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-purple-500 shadow-[0_0_8px_rgba(168,85,247,0.6)]"></div> +B (Magnetic)</div>
                    <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-yellow-500 shadow-[0_0_8px_rgba(234,179,8,0.6)]"></div> -B (Magnetic)</div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
