<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Geon Framework Particle Grid</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffffff;
            font-family: serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* Overlay text matching the image labels */
        .labels {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        .row {
            flex: 1;
            display: flex;
            align-items: center;
        }

        .header-row {
            height: 80px;
            display: flex;
            align-items: flex-end;
            padding-bottom: 20px;
            font-weight: bold;
            font-size: 16px;
        }

        .header-col {
            flex: 1;
            text-align: center;
        }

        .row-label {
            width: 80px;
            text-align: center;
            transform: rotate(-90deg);
            transform-origin: center;
            font-weight: bold;
            font-size: 16px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="labels">
        <div class="header-row">
            <div style="width: 80px;"></div>
            <div class="header-col">Top View</div>
            <div class="header-col">Isometric View</div>
            <div class="header-col">Side Profile</div>
        </div>
        <div class="row" style="margin-top: -80px">
            <div class="row-label">Electron ($e^-$)</div>
            <div style="flex:3;"></div>
        </div>
        <div class="row">
            <div class="row-label">Proton ($p^+$)</div>
            <div style="flex:3;"></div>
        </div>
        <div class="row">
            <div class="row-label">Neutron ($n^0$)</div>
            <div style="flex:3;"></div>
        </div>
    </div>
    <div id="canvas-container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Use KaTeX for rendering the symbols if needed, but plain text handles the basic subscript well enough. Let's stick to plain text or basic HTML for speed unless needed -->
    <script>
        // Update DOM labels to use HTML sup/sub
        document.querySelectorAll('.row-label')[0].innerHTML = 'Electron (e<sup>-</sup>)';
        document.querySelectorAll('.row-label')[1].innerHTML = 'Proton (p<sup>+</sup>)';
        document.querySelectorAll('.row-label')[2].innerHTML = 'Neutron (n<sup>0</sup>)';
    </script>
    <script src="app.js"></script>
</body>
</html>
