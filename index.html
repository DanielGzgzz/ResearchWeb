<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geon Framework Computational Simulation Environment</title>
    <!-- Tailwind CSS (CDN for zero-build setup) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">

    <!-- KaTeX for formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" crossorigin="anonymous"></script>

    <!-- Three.js Library & Addons via Import Maps -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>
</head>
<body class="bg-[#050510] text-slate-200 font-sans overflow-hidden">

    <div class="w-full h-screen flex flex-col md:flex-row bg-[#020205] text-[#d4d4d8] selection:bg-blue-900 selection:text-white">
        <!-- Main Simulation Engine Area -->
        <div id="canvas-container" class="flex-grow h-screen relative overflow-hidden border-r border-[#1e1e24] cursor-move">

            <!-- Particle Selection Buttons -->
            <div class="absolute top-4 left-4 z-20 flex gap-2">
                <button id="btn-electron" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded text-[12px] tracking-wider transition-colors shadow-lg">
                    Electron (Möbius 4π)
                </button>
                <button id="btn-proton" class="bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-4 rounded text-[12px] tracking-wider transition-colors shadow-lg">
                    Proton (Trefoil)
                </button>
                <button id="btn-photon" class="bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-2 px-4 rounded text-[12px] tracking-wider transition-colors shadow-lg">
                    Photon (Linear)
                </button>
            </div>

            <!-- In-Canvas Engine Status -->
            <div class="absolute bottom-4 left-4 z-20 pointer-events-none text-[10px] font-mono text-slate-500 flex flex-col gap-1">
                <div class="flex items-center gap-2">
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Free Observation Mode
                </div>
                <div class="text-[9px] text-slate-600">Drag to Rotate &bull; Scroll to Zoom &bull; Right-Click to Pan</div>
            </div>

            <!-- Structural Legend -->
            <div class="absolute bottom-4 right-4 z-20 p-4 bg-[#0a0a0f]/80 backdrop-blur-md border border-[#1e1e24] rounded-md shadow-2xl pointer-events-none">
                <h4 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">Field Topology Mapping</h4>
                <div class="grid grid-cols-2 gap-y-2 gap-x-4 text-[11px] font-mono">
                    <div class="flex items-center gap-2"><div class="w-2.5 h-2.5 rounded bg-[#00E676] shadow-[0_0_8px_rgba(0,230,118,0.4)]"></div> <span class="text-slate-400">E Vector (+)</span></div>
                    <div class="flex items-center gap-2"><div class="w-2.5 h-2.5 rounded bg-[#D50000] shadow-[0_0_8px_rgba(213,0,0,0.4)]"></div> <span class="text-slate-400">E Vector (-)</span></div>
                    <div class="flex items-center gap-2"><div class="w-2.5 h-2.5 rounded bg-[#651FFF] shadow-[0_0_8px_rgba(101,31,255,0.4)]"></div> <span class="text-slate-400">B Vector (+)</span></div>
                    <div class="flex items-center gap-2"><div class="w-2.5 h-2.5 rounded bg-[#FFAB00] shadow-[0_0_8px_rgba(255,171,0,0.4)]"></div> <span class="text-slate-400">B Vector (-)</span></div>
                    <div class="flex items-center gap-2 col-span-2 mt-1"><div class="w-2.5 h-0.5 bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.6)]"></div> <span class="text-slate-400">Poynting Vector (S) Flow</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Scrollbar Styling for Academic Theme -->
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0a0a0f;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #2a2a35;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #3a3a45;
        }
        /* Override KaTeX fonts to match the monospace academic look slightly better */
        .katex { font-size: 1.05em; }
        .katex-display { margin: 0.5em 0; overflow-x: auto; overflow-y: hidden; }
    </style>

    <script type="module" src="app.js"></script>
</body>
</html>
